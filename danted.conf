# SOCKS5 proxy configuration for Dante
logoutput: /var/log/danted.log
debug: 2

# Internal network interface (container side)
internal: 0.0.0.0 port = 1080

# External network interface (VPN interface)
external: ppp0

# Authentication method - no authentication needed for local use
clientmethod: none
socksmethod: none

# Allow all users
user.privileged: root
user.notprivileged: nobody

# Client rules
client pass {
    from: 0.0.0.0/0 to: 0.0.0.0/0
    log: connect disconnect error
}

# SOCKS rules
socks pass {
    from: 0.0.0.0/0 to: 0.0.0.0/0
    log: connect disconnect error
}
